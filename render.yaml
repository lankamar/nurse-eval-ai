services:
  # Backend API (FastAPI)
  - name: nurse-eval-api
    type: web
    env: python
    plan: free
    branch: SIMULADOR
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nurse-eval-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: TOTP_ISSUER
        value: "NurseEval"
      - key: TOTP_INTERVAL
        value: "30"
      - key: BACKUP_CODES
        value: "10"
      - key: REDIS_URL
        value: "redis://localhost:6379/0"
      - key: DEMO_TOTP_SECRET
        value: "JBSWY3DPEHPK3PXP"
      - key: DEMO_BACKUP_CODES
        value: '["BACKUP-0001","BACKUP-0002","BACKUP-0003","BACKUP-0004","BACKUP-0005"]'
    healthCheckPath: /health

  # Frontend (React + Vite)
  - name: nurse-eval-frontend
    type: web
    env: static
    
    branch: SIMULADOR
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: "https://nurse-eval-api.onrender.com"

databases:
  - name: nurse-eval-db
    plan: free
