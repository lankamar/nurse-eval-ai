version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nurse-eval-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nurseeval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nurseeval_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-nurse_eval_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nurseeval"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nurse-eval-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nurseeval}:${POSTGRES_PASSWORD:-nurseeval_secure_pass}@db:5432/${POSTGRES_DB:-nurse_eval_db}
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_cache:/root/.cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nurse-eval-frontend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
      REACT_APP_SENTRY_DSN: ${REACT_APP_SENTRY_DSN:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start

volumes:
  postgres_data:
  backend_cache:
